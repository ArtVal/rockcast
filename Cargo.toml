[package]
name = "rockcast"
version = "0.1.0"
edition = "2024"
description = "RockCast — internet radio on Chromecast / Google Cast"

[dependencies]
cpal = "0.15"
eframe = { version = "0.33", default-features = true }
egui = "0.33"
env_logger = "0.11"
if-addrs = "0.14"
log = "0.4"
mdns-sd = "0.15"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "deflate"] }
rustfft = "6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "ogg", "flac", "pcm", "isomp4", "vorbis"] }
thiserror = "2"
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
