[package]
name = "rockcast"
version = "0.1.0"
edition = "2024"
description = "RockCast — internet radio on Chromecast / Google Cast"

[dependencies]
cpal = "0.15"
eframe = { version = "0.33", default-features = true }
egui = "0.33"
env_logger = "0.11"
if-addrs = "0.14"
log = "0.4"
mdns-sd = "0.15"
ogg = "0.9"
opus-decoder = "0.1"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "deflate"] }
ropus = "0.12.18"
rustfft = "6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "ogg", "flac", "pcm", "isomp4", "vorbis"] }
symphonia-adapter-fdk-aac = { version = "0.1.3", default-features = false }
fdk-aac = "0.8"
thiserror = "2"
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }

[[example]]
name = "eq_profile"
path = "examples/eq_profile.rs"
